<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Build n8n workflows with agents. Deploy by environment. Bring changes back.</title>
  <desc id="desc">Project architecture. Claude, Hermes, or Codex edits reusable project files: workflows, code, prompts, and tests. Development and production each have one environment workspace containing their own workflow IDs, credential references, durable synchronization state, and builds. Each workspace deploys to its own n8n deployment, where workflows execute and people can edit them. Review and resynchronization bring remote changes back to the workspace and reusable files. Installed tooling is read-only and separate from project files. The tool cache holds downloaded dependencies that can be downloaded again; environment bindings and synchronization history must be preserved. Secrets stay outside reusable source.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#35516b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#257a70"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #18344a; }
      .heading { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
      .subheading { font-size: 17px; fill: #536777; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #536777; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #657988; }
      .out { fill: none; stroke: #35516b; stroke-width: 2.4; marker-end: url(#arrow); }
      .back { fill: none; stroke: #257a70; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#return); }
    </style>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#f7fafc"/>
  <text x="36" y="49" class="heading">Build once. Deploy by environment. Bring changes back.</text>
  <text x="36" y="79" class="subheading">Agents work with your files; n8n runs your workflows.</text>

  <!-- Agent and reusable source are independent of the selected environment. -->
  <text x="36" y="186" class="eyebrow">YOUR AGENT</text>
  <rect x="36" y="205" width="170" height="186" rx="14" fill="#ffffff" stroke="#c8d6e0"/>
  <rect x="52" y="224" width="35" height="35" rx="9" fill="#e7eef6"/>
  <path d="m60 237 6 5-6 5m10 0h9" fill="none" stroke="#35516b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="53" y="289" class="label">Coding agent</text>
  <text x="53" y="322" class="body">Claude · Hermes</text>
  <text x="53" y="346" class="body">Codex</text>
  <text x="53" y="374" class="small">Uses your preferences</text>

  <path d="M209 282 H254" class="out"/>
  <text x="218" y="269" class="small">edit</text>
  <text x="266" y="186" class="eyebrow">YOUR PROJECT</text>
  <rect x="266" y="205" width="260" height="235" rx="14" fill="#ffffff" stroke="#c8d6e0"/>
  <rect x="283" y="224" width="35" height="35" rx="9" fill="#e7eef6"/>
  <path d="M292 232h10l5 5v15h-15zm10 0v6h5" fill="none" stroke="#35516b" stroke-width="2" stroke-linejoin="round"/>
  <text x="284" y="289" class="label">Reusable files</text>
  <text x="284" y="322" class="body">Workflows · code</text>
  <text x="284" y="346" class="body">Prompts · tests</text>
  <path d="M284 365 H508" stroke="#e0e8ee"/>
  <text x="284" y="391" class="body">Versioned together in Git</text>
  <text x="284" y="418" class="small">Keep your existing layout</text>

  <!-- A definition is bound independently for each environment. -->
  <text x="632" y="107" class="eyebrow">ONE WORKSPACE PER ENVIRONMENT</text>
  <path d="M529 298 H558 V175 H626" class="out"/>
  <path d="M558 298 V410 H626" class="out"/>
  <text x="572" y="162" class="small">bind</text>
  <text x="572" y="397" class="small">bind</text>
  <path d="M628 286 H595 V352 H531" class="back"/>
  <path d="M628 521 H577 V404 H531" class="back"/>
  <text x="543" y="338" class="small" style="fill:#257a70">review</text>

  <rect x="632" y="125" width="250" height="198" rx="14" fill="#ecf6f3" stroke="#a7cfc2"/>
  <rect x="632" y="125" width="7" height="198" rx="3" fill="#2d8977"/>
  <text x="651" y="160" class="label">Development</text>
  <text x="651" y="190" class="small">Environment workspace</text>
  <path d="M651 205 H863" stroke="#c9e2d9"/>
  <text x="651" y="232" class="body">Workflow IDs · credential refs</text>
  <text x="651" y="258" class="body">Durable sync state · builds</text>
  <text x="651" y="296" class="small">Secrets isolated from source</text>

  <rect x="632" y="360" width="250" height="198" rx="14" fill="#edf2fa" stroke="#bacbe6"/>
  <rect x="632" y="360" width="7" height="198" rx="3" fill="#557aaf"/>
  <text x="651" y="395" class="label">Production</text>
  <text x="651" y="425" class="small">Environment workspace</text>
  <path d="M651 440 H863" stroke="#d0dbed"/>
  <text x="651" y="467" class="body">Workflow IDs · credential refs</text>
  <text x="651" y="493" class="body">Durable sync state · builds</text>
  <text x="651" y="531" class="small">Secrets isolated from source</text>

  <!-- Explicit outbound deployment; remote edits return for review. -->
  <path d="M886 186 H988" class="out"/>
  <text x="913" y="172" class="small">deploy</text>
  <path d="M989 265 H887" class="back"/>
  <text x="890" y="288" class="small" style="fill:#257a70">review + resync</text>
  <path d="M886 421 H988" class="out"/>
  <text x="913" y="407" class="small">deploy</text>
  <path d="M989 500 H887" class="back"/>
  <text x="890" y="523" class="small" style="fill:#257a70">review + resync</text>

  <text x="994" y="107" class="eyebrow" style="font-size:12px;letter-spacing:1px">SEPARATE DEPLOYMENTS</text>
  <rect x="994" y="125" width="170" height="198" rx="14" fill="#ffffff" stroke="#a7cfc2"/>
  <text x="1012" y="161" class="label">n8n dev</text>
  <path d="M1012 180 H1146" stroke="#e0e8ee"/>
  <text x="1012" y="211" class="body">Run workflows</text>
  <text x="1012" y="244" class="body">UI edits</text>
  <text x="1012" y="270" class="body">Execution results</text>
  <text x="1012" y="302" class="small">Dev data + secrets</text>
  <rect x="994" y="360" width="170" height="198" rx="14" fill="#ffffff" stroke="#bacbe6"/>
  <text x="1012" y="396" class="label">n8n prod</text>
  <path d="M1012 415 H1146" stroke="#e0e8ee"/>
  <text x="1012" y="446" class="body">Run workflows</text>
  <text x="1012" y="479" class="body">UI edits</text>
  <text x="1012" y="505" class="body">Execution results</text>
  <text x="1012" y="537" class="small">Prod data + secrets</text>

  <!-- Supporting machinery has a separate lifetime and ownership. -->
  <path d="M36 592 H1164" stroke="#dbe4eb"/>
  <text x="36" y="622" class="small"><tspan font-weight="700" fill="#35516b">Installed tooling</tspan><tspan dx="8">Read-only skills + helpers</tspan></text>
  <text x="424" y="622" class="small"><tspan font-weight="700" fill="#35516b">Tool cache</tspan><tspan dx="8">Downloaded dependencies</tspan></text>
  <text x="1164" y="653" text-anchor="end" class="small">One workspace · one deployment</text>
</svg>
